<!-- Das "o" aus VELoCITY: roter Ring auf Marineblau. Bei 16 Punkten
     traegt kein Buchstabe mehr, ein Ring schon - und er ist ohnehin
     das Zeichen der Wortmarke. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="VeloCity">
  <rect width="32" height="32" rx="7" fill="#061841"/>
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#f00038" stroke-width="5"/>
</svg>
