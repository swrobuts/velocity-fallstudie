# =====================================================================
# Auslieferung von wawi.butscher.cloud
#
# TLS, Weiterleitung und Zertifikat macht der Traefik davor. Hier steht
# nur, was der Webserver selbst zu tun hat.
# =====================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Anders als bei bikes.butscher.cloud tragen style.css und die
    # JavaScript-Dateien hier KEINEN Fingerabdruck im Namen - es gibt
    # kein tools/versionieren.py fuer wawi/. Ein langes "immutable"
    # Cache-Alter wie im Vorbild wuerde deshalb genau den Fehler wieder
    # einfuehren, gegen den der Fingerabdruck bei bikes erst eingefuehrt
    # wurde: eine geaenderte Datei bliebe im Browser 30 Tage lang
    # unsichtbar. Deshalb hier no-cache fuer Skripte und Stylesheet,
    # so wie fuer die HTML-Seite selbst.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    # Das Favicon aendert sich praktisch nie und traegt keine Fachdaten -
    # ein kurzes Cache-Alter reicht, ohne bei einer seltenen Aenderung
    # tagelang eine alte Fassung auszuliefern.
    location ~* \.(svg|webp|jpg|jpeg|png|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Verzeichnisse listen wir nicht auf.
    autoindex off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Bilder und Skripte kommen von hier, die Daten von Supabase.
    # Weitergehende Regeln (CSP) gehoeren hierher, sobald sie
    # nachweislich getestet sind - eine falsch gesetzte CSP legt die
    # Anmeldung lahm, und das faellt erst im Betrieb auf.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
