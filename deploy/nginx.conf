# =====================================================================
# Auslieferung von bikes.butscher.cloud
#
# TLS, Weiterleitung und Zertifikat macht der Traefik davor. Hier steht
# nur, was der Webserver selbst zu tun hat.
# =====================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Die eingebundenen Dateien tragen einen Fingerabdruck im Namen
    # (style.css?v=cbffd592). Aendert sich der Inhalt, aendert sich die
    # Adresse - deshalb darf der Browser sie lange behalten. Die
    # HTML-Seiten selbst tragen keinen und muessen jedes Mal frisch
    # geholt werden, sonst zeigt der Browser alte Fingerabdruecke und
    # damit alte Dateien.
    location ~* \.(css|js|webp|jpg|jpeg|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    # Verzeichnisse listen wir nicht auf.
    autoindex off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Bilder und Skripte kommen von hier, die Daten von Supabase.
    # Weitergehende Regeln (CSP) gehoeren hierher, sobald sie
    # nachweislich getestet sind - eine falsch gesetzte CSP legt die
    # Karte lahm, und das faellt erst im Betrieb auf.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
