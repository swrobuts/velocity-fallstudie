# =====================================================================
# Auslieferung von bikes.butscher.cloud
#
# TLS, Weiterleitung und Zertifikat macht der Traefik davor. Hier steht
# nur, was der Webserver selbst zu tun hat.
# =====================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Die eingebundenen Dateien tragen einen Fingerabdruck im Namen
    # (style.css?v=cbffd592). Aendert sich der Inhalt, aendert sich die
    # Adresse - deshalb darf der Browser sie lange behalten. Die
    # HTML-Seiten selbst tragen keinen und muessen jedes Mal frisch
    # geholt werden, sonst zeigt der Browser alte Fingerabdruecke und
    # damit alte Dateien.
    #
    # add_header wird von der server-Ebene NUR dann in einen location-Block
    # vererbt, wenn dieser Block selbst kein eigenes add_header setzt. Sobald
    # hier Cache-Control gesetzt wird, zaehlen die beiden add_header am Ende
    # dieser Datei fuer genau diesen Block nicht mehr - sie muessen deshalb
    # in jedem Block wiederholt werden, der Cache-Control setzt.
    location ~* \.(css|js|webp|jpg|jpeg|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Verzeichnisse listen wir nicht auf.
    autoindex off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Bilder und Skripte kommen von hier, die Daten von Supabase.
    # Weitergehende Regeln (CSP) gehoeren hierher, sobald sie
    # nachweislich getestet sind - eine falsch gesetzte CSP legt die
    # Karte lahm, und das faellt erst im Betrieb auf.
    #
    # Gelten nur fuer Anfragen, die keinen der beiden location-Bloecke oben
    # treffen (etwa /) - dort mit eigenem add_header wiederholt, siehe deren
    # Kommentar.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
